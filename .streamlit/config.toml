[server]
headless = true

[browser]
gatherUsageStats = false

# Align Streamlit's native (BaseWeb) widget theme with the FAP design system.
# The application now has ONE fixed appearance: an always-LIGHT workspace (with a
# dark navigation rail skinned separately in fap.theme.css). Setting the base to the
# FAP LIGHT palette makes native controls (selectboxes, steppers, radios, popovers,
# menus) render light AT THE SOURCE, so they match the light workspace and never
# appear as dark/white blocks. These mirror fap.theme.colors.DEFAULT_PALETTE.light.
[theme]
base = "light"
primaryColor = "#E07B2B"
backgroundColor = "#F4F6FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141A22"
font = "sans serif"
