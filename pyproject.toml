[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fap"
version = "1.0.0"
description = "First Team Football Analysis Platform - modular, plugin-based analytics"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.42",          # native OpenID Connect authentication (st.login/st.user)
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "mplsoccer>=1.2",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "pillow>=10.0",
    "qrcode>=8.0",              # QR-code report blocks (renders to a PIL image)
    "Authlib>=1.3",             # OIDC flow behind Streamlit's native auth
    "pyarrow>=14",              # Parquet dataset storage (persistent match data)
    "plotly>=5.0",              # optional interactive preview for the comparison charts
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8", "ruff>=0.3"]
# Editable Office export (Phase 6C). PDF and HTML/Markdown need no extra deps
# (PDF reuses matplotlib); DOCX/PPTX degrade gracefully until these are installed.
publishing = ["python-docx>=1.1", "python-pptx>=0.6"]
# Production persistence & infrastructure (Phase 11). All optional and
# import-guarded: the default sqlite/local/disk stack runs without any of them.
libsql = ["libsql-experimental>=0.0.30"]     # database.backend = 'libsql' (Turso)
objectstorage = ["boto3>=1.34"]              # storage.backend  = 's3' (S3/R2/B2/MinIO)
rediscache = ["redis>=5.0"]                  # cache.backend    = 'redis'
production = ["libsql-experimental>=0.0.30", "boto3>=1.34", "redis>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 110
