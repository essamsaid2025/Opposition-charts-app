<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; --accent: #2f7bd6; --border: #232733;
    --surface: #12151c; --text: #eef2f7; --muted: #8a93a2; --chip: #1b2029; }
  html, body { margin: 0; padding: 0; background: transparent;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { display: flex; flex-direction: column; gap: 8px; }

  /* palette rail -------------------------------------------------- */
  #palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; cursor: grab;
    user-select: none; touch-action: none; transition: border-color .12s, box-shadow .12s;
  }
  .chip:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .chip.disabled { opacity: .45; cursor: not-allowed; }

  /* board --------------------------------------------------------- */
  #stage { position: relative; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  /* #stage is made focusable (tabindex=0 in JS) so the iframe gains keyboard focus on click and
     the window keydown handler (Delete/Backspace/Escape) actually receives events — without a
     visible focus ring, which would look wrong around the pitch. */
  #stage:focus, #stage:focus-visible { outline: none; }
  #stage svg.tb-board-svg { display: block; width: 100%; height: auto; }
  #stage [data-oid] { cursor: grab; }
  #stage [data-oid].locked { cursor: not-allowed; }
  #stage [data-oid].dragging { cursor: grabbing; }
  .tb-handle { cursor: grab; }
  #hint { font-size: 11px; color: var(--muted); padding: 0 2px; }

  /* drag ghost following the cursor when adding from the palette --- */
  #ghost { position: fixed; pointer-events: none; z-index: 9; width: 30px; height: 30px;
    border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%);
    display: none; box-shadow: 0 2px 10px rgba(0,0,0,.4); }

  /* ===================== Tacticalista-style in-board editor chrome (light) ============ */
  #editor{ --e-bar:#2c2c30; --e-ink:#1c1e22; --e-mut:#8a8f99; --e-line:#e6e6ec; --e-panel:#fff;
    --e-canvas:#e8e8ea; --e-chip:#e2e5ea; --e-sel:#4a90d9; --e-head:#2e9e5b; --e-home:#e23b3b;
    --e-away:#2f6fd6; --e-pill:#1c1e22;
    display:grid; grid-template-rows:44px 1fr 44px; min-height:660px; background:var(--e-canvas);
    border:1px solid var(--e-line); border-radius:12px; overflow:hidden;
    color:var(--e-ink); font-size:13px; }
  #timeline{ background:var(--e-panel); border-top:1px solid var(--e-line); display:flex; align-items:center; gap:6px; padding:0 10px; }
  #timeline .tl-nav{ width:30px; height:28px; border:1px solid var(--e-line); border-radius:6px; background:#fff; display:grid; place-items:center; color:#3a3d44; }
  #timeline .tl-nav:hover{ background:#f2f3f6; } #timeline .tl-nav svg{ width:16px; height:16px; }
  #tl-frames{ display:flex; gap:6px; overflow-x:auto; flex:1; padding:6px 0; }
  #tl-frames .tl-chip{ min-width:64px; height:30px; border:1px solid var(--e-line); border-radius:6px; background:#fff; display:grid; place-items:center; font-size:11px; font-weight:600; color:#5a5d64; white-space:nowrap; padding:0 8px; }
  #tl-frames .tl-chip.on{ border-color:var(--e-sel); color:var(--e-ink); box-shadow:inset 0 0 0 1px var(--e-sel); }
  .ov{ position:fixed; inset:0; background:rgba(20,22,28,.32); display:none; place-items:center; z-index:60; }
  .ov.show{ display:grid; }
  .mdl{ background:#fff; border-radius:12px; box-shadow:0 24px 70px rgba(0,0,0,.35); width:min(390px,94vw); overflow:hidden; }
  .mdl.wide{ width:min(760px,94vw); }
  .mhd{ background:var(--e-bar); color:#fff; display:flex; align-items:center; padding:12px 16px; }
  .mhd b{ flex:1; text-align:center; font-size:15px; font-weight:700; }
  .mhd .x{ width:30px; height:30px; border-radius:50%; background:#4a4a50; border:0; color:#fff; display:grid; place-items:center; }
  .mhd .x svg{ width:16px; height:16px; }
  .mbd{ padding:16px 18px; max-height:76vh; overflow:auto; color:var(--e-ink); }
  #topbar .ic.on{ background:#4a4a50; color:#fff; }
  .ftabs{ display:flex; border-bottom:1px solid var(--e-line); margin-bottom:12px; }
  .ftabs button{ flex:1; background:#fff; border:0; padding:9px; font-weight:700; color:#8a8f99; border-bottom:2px solid transparent; }
  .ftabs button.on{ color:var(--e-sel); border-bottom-color:var(--e-sel); }
  .frow2{ display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .frow2 select{ flex:1; border:1px solid var(--e-line); border-radius:8px; padding:9px; font-weight:700; background:#fff; }
  .mpill{ background:var(--e-pill); color:#fff; border:0; border-radius:8px; padding:9px 18px; font-weight:700; }
  .flist{ display:flex; flex-direction:column; gap:4px; }
  .mrow{ display:flex; align-items:center; gap:8px; }
  .mrow .fnm{ flex:1; } .mrow .fno{ width:56px; }
  .mrow input{ border:1px solid var(--e-line); border-radius:6px; padding:7px; font-size:12px; min-width:0; }
  .mrow .fpos{ width:44px; text-align:right; font-weight:700; color:#5a5d64; font-size:12px; }
  .mrow2{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--e-line); }
  .mrow2:first-child{ border-top:0; }
  .mghost{ background:#fff; border:1px solid var(--e-line); border-radius:8px; padding:7px 14px; font-weight:600; }
  .mbd .toggle{ width:38px;height:22px;border-radius:22px;background:#cfd3db;position:relative;border:0;flex:none; }
  .mbd .toggle::after{ content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff; }
  .mbd .toggle.on{ background:var(--e-head); } .mbd .toggle.on::after{ left:18px; }
  .mbd .slbl{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--e-mut); font-weight:700; margin:2px 0 4px; }
  .mbd input[type=color]{ width:40px; height:28px; padding:0; border:1px solid var(--e-line); border-radius:6px; background:#fff; cursor:pointer; }
  .mbd .cdot{ display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; border:1px solid rgba(0,0,0,.15); }
  #editor button{ font:inherit; color:inherit; cursor:pointer; }
  #editor .lbl{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--e-mut); font-weight:600; }
  #topbar{ background:var(--e-bar); color:#fff; display:flex; align-items:center; gap:2px; padding:0 8px; }
  #topbar .ic{ width:32px; height:30px; display:grid; place-items:center; border-radius:6px; color:#e8e9ec; background:none; border:0; }
  #topbar .ic:hover{ background:#3a3a40; }
  #topbar .ic:disabled{ opacity:.35; cursor:default; }
  #topbar .ic svg{ width:19px; height:19px; }
  #topbar .sep{ width:1px; height:20px; background:#45454c; margin:0 5px; }
  #topbar .frames{ display:flex; align-items:center; gap:8px; color:#cfd1d6; font-weight:600; font-size:12px; }
  #topbar .spacer{ flex:1; }
  #topbar .zoom{ font-weight:700; color:#fff; padding:0 6px; }
  #topbar .b2d{ border:1px solid #55555c; border-radius:4px; padding:1px 6px; font-size:11px; font-weight:700; }
  #editbody{ display:grid; grid-template-columns:214px 46px 1fr; min-height:560px; }
  #ctxpanel{ background:var(--e-panel); border-right:1px solid var(--e-line); overflow-y:auto; padding:10px 12px 30px; }
  #ctxpanel::-webkit-scrollbar{ width:9px; } #ctxpanel::-webkit-scrollbar-thumb{ background:#d7d9e0; border-radius:9px; }
  #toolrail{ background:var(--e-panel); border-right:1px solid var(--e-line); display:flex; flex-direction:column;
    align-items:center; padding:6px 0; gap:3px; overflow-y:auto; }
  #toolrail::-webkit-scrollbar{ width:0; }
  #toolrail .tool{ width:34px; height:32px; border-radius:6px; display:grid; place-items:center; color:#26282d; border:0; background:none; }
  #toolrail .tool:hover{ background:#f1f2f5; } #toolrail .tool.on{ background:var(--e-chip); }
  #toolrail .tool svg{ width:20px; height:20px; }
  #stagewrap{ position:relative; display:grid; place-items:center; padding:18px; overflow:auto; background:var(--e-canvas); }
  #stagewrap #stage{ border:0; border-radius:4px; background:#fff; box-shadow:0 6px 24px rgba(20,22,28,.14); max-width:100%; }
  #stagewrap #stage svg.tb-board-svg{ width:min(70vw,1000px); }
  #hint{ display:none !important; }

  /* context panel controls */
  #ctxpanel .fn .lbl{ margin-bottom:4px; }
  #ctxpanel input[type=text],#ctxpanel input[type=number]{ width:100%; border:1px solid var(--e-line); border-radius:6px; padding:7px 9px; font-size:13px; background:#fff; color:var(--e-ink); }
  #ctxpanel .chead{ display:flex; align-items:center; gap:8px; margin:12px 0 4px; padding:8px 0; border-top:1px solid var(--e-line); }
  #ctxpanel .chead .q{ width:20px;height:20px;border-radius:50%;background:#e9ebf0;display:grid;place-items:center;color:#7b7f88;font-weight:700;font-size:11px;flex:none; }
  #ctxpanel .chead b{ font-size:13px; font-weight:700; }
  #ctxpanel .sec{ padding:11px 0; border-top:1px solid var(--e-line); }
  #ctxpanel .sec:first-of-type{ border-top:0; }
  #ctxpanel .row{ display:flex; align-items:center; gap:10px; }
  #ctxpanel .between{ justify-content:space-between; }
  #ctxpanel .note{ color:var(--e-mut); font-size:12px; padding:6px 0; }
  #ctxpanel .seg{ display:flex; border:1px solid var(--e-line); border-radius:7px; overflow:hidden; }
  #ctxpanel .seg button{ flex:1; border:0; background:#fff; padding:6px 4px; font-size:12px; font-weight:600; color:#4a4d55; border-left:1px solid var(--e-line); }
  #ctxpanel .seg button:first-child{ border-left:0; } #ctxpanel .seg button.on{ background:var(--e-pill); color:#fff; }
  #ctxpanel .pill{ display:block; width:100%; text-align:center; background:var(--e-pill); color:#fff; border:0; border-radius:22px; padding:9px; font-weight:700; font-size:12.5px; }
  #ctxpanel .ghost{ display:block; width:100%; text-align:center; background:#fff; color:var(--e-ink); border:1px solid var(--e-line); border-radius:22px; padding:8px; font-weight:600; font-size:12px; }
  #ctxpanel .toggle{ width:38px;height:22px;border-radius:22px;background:#cfd3db;position:relative;border:0;flex:none;transition:background .15s; }
  #ctxpanel .toggle::after{ content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s; }
  #ctxpanel .toggle.on{ background:var(--e-head); } #ctxpanel .toggle.on::after{ left:18px; }
  #ctxpanel input[type=color]{ width:30px; height:26px; padding:0; border:1px solid var(--e-line); border-radius:6px; background:#fff; }
  #ctxpanel input[type=range]{ -webkit-appearance:none; appearance:none; height:4px; border-radius:4px; background:#d9dce3; flex:1; }
  #ctxpanel input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:1px solid #b9bdc6; }
  #ctxpanel select{ border:1px solid var(--e-line); border-radius:7px; padding:7px; font-weight:600; background:#fff; flex:1; }
  #ctxpanel .val{ min-width:26px; text-align:right; font-weight:700; }
  #ctxpanel .plist{ display:flex; flex-direction:column; gap:2px; }
  #ctxpanel .prow{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  #ctxpanel .prow:hover{ background:#f4f5f8; } #ctxpanel .prow.on{ background:#eef4fb; }
  #ctxpanel .prow .dot{ width:16px; height:16px; border-radius:50%; flex:none; }
</style>
</head>
<body>
<div id="editor">
  <div id="topbar">
    <button class="ic" id="tb-new" title="New board">$ic:file$</button>
    <span class="sep"></span>
    <button class="ic" id="tb-undo" title="Undo">$ic:undo$</button>
    <button class="ic" id="tb-redo" title="Redo">$ic:redo$</button>
    <span class="sep"></span>
    <button class="ic" id="tb-dup" title="Duplicate" disabled>$ic:paste$</button>
    <button class="ic" id="tb-del" title="Delete" disabled>$ic:trash$</button>
    <span class="sep"></span>
    <button class="ic" id="tb-grid" title="Grid lines">$ic:grid$</button>
    <button class="ic" id="tb-orient" title="Flip orientation">$ic:flip$</button>
    <button class="ic" id="tb-form" title="Formation">$ic:formation$</button>
    <button class="ic" id="tb-set" title="Board settings">$ic:gear$</button>
    <div class="spacer"></div>
    <span class="frames"><span id="tb-frames">1/1</span></span>
    <span class="zoom">100%</span>
    <span class="b2d">2D</span>
  </div>
  <div id="editbody">
    <aside id="ctxpanel"></aside>
    <nav id="toolrail">
      <button class="tool on" data-tool="select" title="Select / Move">$ic:cursor$</button>
      <button class="tool" data-tool="home" title="Home player">$ic:jerseyF$</button>
      <button class="tool" data-tool="away" title="Away player">$ic:jerseyO$</button>
      <button class="tool" data-tool="ball" title="Ball">$ic:ball$</button>
      <button class="tool" data-tool="cone" title="Cone">$ic:cone$</button>
      <button class="tool" data-tool="arrow" title="Arrow">$ic:arrow$</button>
      <button class="tool" data-tool="curved_arrow" title="Curved arrow">$ic:arrowC$</button>
      <button class="tool" data-tool="dashed_arrow" title="Dashed arrow">$ic:arrowD$</button>
      <button class="tool" data-tool="line" title="Line">$ic:line2$</button>
      <button class="tool" data-tool="circle" title="Circle">$ic:circle$</button>
      <button class="tool" data-tool="shape" title="Rectangle">$ic:square$</button>
      <button class="tool" data-tool="zone" title="Zone">$ic:zone$</button>
      <button class="tool" data-tool="text" title="Text">$ic:text$</button>
    </nav>
    <div id="stagewrap">
      <div id="palette" hidden></div>
      <div id="stage"></div>
    </div>
  </div>
  <div id="timeline">
    <button class="tl-nav" id="tl-prev" title="Previous frame">$ic:chevL$</button>
    <div id="tl-frames"></div>
    <button class="tl-nav" id="tl-add" title="Add frame">$ic:plus$</button>
    <button class="tl-nav" id="tl-del" title="Delete frame">$ic:trash$</button>
  </div>
</div>
<div class="ov" id="ov-form"><div class="mdl"><div class="mhd"><b>Formation batch setting</b><button class="x" data-close="ov-form">$ic:x$</button></div><div class="mbd" id="form-body"></div></div></div>
<div class="ov" id="ov-set"><div class="mdl"><div class="mhd"><b>Board settings</b><button class="x" data-close="ov-set">$ic:x$</button></div><div class="mbd" id="set-body"></div></div></div>
<div id="ghost"></div>
<script>
(function () {
  // ---- Streamlit static-component bridge (same protocol as studio/sortable) ----
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function ready() { send("streamlit:componentReady", { apiVersion: 1 }); }
  function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 2 }); }
  // ---- local-first sync ("no reload on move") ---------------------------------
  // Moving/adjusting a piece must NOT talk to Python at all — the piece just moves in the
  // browser (its live SVG transform), exactly like a plain client canvas, so Streamlit never
  // reruns and the board never re-renders while you drag. Edits ACCUMULATE locally and are
  // synced to Python only on an explicit action: a structural command (add / delete / select /
  // undo / redo / draw) drains them in the SAME payload, or leaving the board (blur — e.g.
  // clicking Save / a toolbar button) flushes them. ``setComponentValue`` is a single value
  // slot, so everything travels in ONE payload (a second emit would overwrite the first).
  var pendingCmds = [], pendingSel = "__keep__";
  function flushSync() {
    if (!pendingCmds.length && pendingSel === "__keep__") return;
    var c = pendingCmds, s = pendingSel; pendingCmds = []; pendingSel = "__keep__";
    send("streamlit:setComponentValue", { dataType: "json", value: { ts: nextTs(), commands: c, select: s } });
  }
  function queueMove(commands, sel) {                 // LOCAL ONLY: accumulate, never rerun on its own
    if (commands && commands.length) pendingCmds = pendingCmds.concat(commands);
    if (sel !== undefined) pendingSel = sel;
  }
  function emit(payload) {
    // immediate action: drain any queued local edits into THIS payload first (single-slot safe),
    // preserving order (moves applied before the new command) and Python-owns-state.
    payload = payload || {};
    if (pendingCmds.length) {
      payload.commands = pendingCmds.concat(payload.commands || []);
      if (payload.select === undefined || payload.select === "__keep__") payload.select = pendingSel;
      pendingCmds = []; pendingSel = "__keep__";
    }
    if (payload.ts == null) payload.ts = nextTs();
    send("streamlit:setComponentValue", { dataType: "json", value: payload });
  }
  // never lose queued edits when focus/visibility leaves the board (e.g. clicking a Streamlit control)
  window.addEventListener("blur", flushSync);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushSync(); });

  // board is authored in a fixed 1050 x 680 plane (10px per pitch unit) — mirrors render.py
  var PLANE_W = 1050, PLANE_H = 680;

  var stage = document.getElementById("stage");
  var paletteEl = document.getElementById("palette");
  var ghost = document.getElementById("ghost");

  // Keyboard focus: the Delete/Backspace/Escape handler is a `window` keydown listener, which only
  // fires while THIS iframe is the browser's focused frame. Clicking a piece never focused the
  // frame (every pointerdown handler calls preventDefault, which also suppresses the default
  // focus-shift to the clicked frame), so the shortcuts silently did nothing. Making #stage a
  // focus target (tabindex 0) and explicitly focusing it on any pointerdown fixes that. focus()
  // is programmatic, so it is NOT affected by the existing preventDefault calls (those stay).
  // preventScroll:true so grabbing focus never scrolls the surrounding Streamlit page.
  stage.tabIndex = 0;
  function focusStage() { try { stage.focus({ preventScroll: true }); } catch (_) {} }
  // Capture phase = runs before the piece/handle/empty-pitch pointerdown handlers, covering every
  // interaction inside the pitch (select, drag, rotate, resize, draw) in ONE place.
  stage.addEventListener("pointerdown", focusStage, true);

  var svg = null, plane = null;          // <svg> and the element whose local space == pitch plane
  var objects = [];                       // [{id,type,x,y,x2,y2,locked}] — metadata only, for handles
  var cfg = { editable: true, snap: 0, selectedId: null, selectedIds: [], colors: {}, palette: [], drawTool: null, placeTool: null, toolDefaults: {} };
  var activeTool = "select";
  var _prevIds = {};                        // object ids from the previous render (auto-select new)
  // strictly-increasing, session-unique action stamp. Date.now() only moves forward, so
  // even if Streamlit remounts the iframe (resetting JS state) a later action never
  // reuses an earlier stamp - this is what lets Python dedup re-delivered values without
  // ever swallowing a real drop or double-applying a non-idempotent add.
  var lastTs = 0;
  function nextTs() { var t = Date.now(); if (t <= lastTs) t = lastTs + 1; lastTs = t; return t; }

  var VECTOR = { arrow: 1, curved_arrow: 1, dashed_arrow: 1, line: 1 };

  function applyColors(colors) {
    var root = document.documentElement.style;
    var map = ["accent", "border", "surface", "text", "muted", "chip"];
    map.forEach(function (k) { if (colors[k]) root.setProperty("--" + k, colors[k]); });
  }

  // ---- coordinate mapping: client px -> pitch 0..100 (orientation-agnostic) -----
  // `plane` is the direct parent of the object groups. In BOTH orientations its local
  // coordinate space is the 1050x680 pitch plane (the vertical board only rotates that
  // whole plane via an ancestor <g>), so getScreenCTM() handles orientation for free.
  function toPlane(clientX, clientY, ref) {
    var m = (ref || plane).getScreenCTM();
    if (!m) return null;
    var pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    var p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  // Drag-time coordinate mapping: the plane's screen transform does NOT change mid-drag
  // (no pan/zoom while dragging), so we snapshot the INVERSE CTM once at drag start and
  // reuse it for every pointermove - avoiding a fresh getScreenCTM()+inverse() (an
  // expensive matrix recompute) on each of the many pointermove events during a fast drag.
  function planeInverseCTM(ref) {
    var m = (ref || plane).getScreenCTM();
    return m ? m.inverse() : null;
  }
  function toPlaneWith(inv, clientX, clientY) {
    var pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    var p = pt.matrixTransform(inv);
    return { x: p.x, y: p.y };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function toPitch(local) {
    var x = clamp(local.x / PLANE_W * 100, 0, 100);
    var y = clamp(local.y / PLANE_H * 100, 0, 100);
    if (cfg.snap && cfg.snap > 0) {
      x = Math.round(x / cfg.snap) * cfg.snap;
      y = Math.round(y / cfg.snap) * cfg.snap;
    }
    return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 };
  }
  function pitchToLocal(px, py) { return { x: px / 100 * PLANE_W, y: py / 100 * PLANE_H }; }

  // ---- curved-arrow control point (MIRRORS render.py curve_control_point / its inverse) --
  // Both operate in the plane's local (1050x680) space, exactly like the Python renderer,
  // so the on-canvas curve handle sits on the visible curve and a drag maps back to the same
  // `curvature` scalar Python stores. Keep these in lock-step with render.py.
  function curveControlPoint(s, e, k) {
    return { x: (s.x + e.x) / 2 + (e.y - s.y) * k,
             y: (s.y + e.y) / 2 - (e.x - s.x) * k };
  }
  function curvatureFromControlPoint(s, e, cx, cy) {
    var dx = e.x - s.x, dy = e.y - s.y, denom = dx * dx + dy * dy;
    if (denom === 0) return 0;
    var mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
    return ((cx - mx) * dy - (cy - my) * dx) / denom;
  }

  // ---- palette drag-to-add ------------------------------------------------------

  function beginRotateDrag(handle, stem, sel, e) {

    // the OPPOSITE corner (fixed anchor) in pitch space; rotation-aware
    var oppRot = rotVec(-sx * sel.w / 2, -sy * sel.h / 2, th);
    var O = { x: sel.x + oppRot.x, y: sel.y + oppRot.y };
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var preview = document.createElementNS(NS, "rect");   // dashed live bounding box
    preview.setAttribute("fill", "none"); preview.setAttribute("stroke", acc);
    preview.setAttribute("stroke-width", 2); preview.setAttribute("stroke-dasharray", "6 5");
    preview.style.pointerEvents = "none"; plane.appendChild(preview);
    function compute(loc) {
      var P = toPitch(loc);                                // pointer, pitch, snapped/clamped
      var dl = rotVec(P.x - O.x, P.y - O.y, -th);          // diagonal in the object's local (un-rotated) frame
      var w = Math.max(Math.abs(dl.x), DRAW_MIN), h = Math.max(Math.abs(dl.y), DRAW_MIN);
      var D = rotVec(dl.x < 0 ? -w : w, dl.y < 0 ? -h : h, th);   // clamped dragged corner back to screen
      var Dx = O.x + D.x, Dy = O.y + D.y;
      return { x: Math.round((O.x + Dx) / 2 * 100) / 100, y: Math.round((O.y + Dy) / 2 * 100) / 100,
               w: Math.round(w * 100) / 100, h: Math.round(h * 100) / 100 };
    }
    var pending = null, raf = 0;
    function paint() {
      raf = 0; if (!pending) return;
      var b = compute(pending), lc = pitchToLocal(b.x, b.y);
      var pw = b.w / 100 * PLANE_W, ph = b.h / 100 * PLANE_H;
      preview.setAttribute("x", lc.x - pw / 2); preview.setAttribute("y", lc.y - ph / 2);
      preview.setAttribute("width", pw); preview.setAttribute("height", ph);
      preview.setAttribute("transform", th ? "rotate(" + th + " " + lc.x + " " + lc.y + ")" : "");
      var dOff = rotVec(sx * pw / 2, sy * ph / 2, th);     // keep the grabbed handle under the pointer
      handle.setAttribute("x", lc.x + dOff.x - 6); handle.setAttribute("y", lc.y + dOff.y - 6);
    }

    function up(ev) {
      handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (preview.parentNode) preview.parentNode.removeChild(preview);   // ALWAYS remove preview

    }
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
  }

  function makeHandle(lx, ly, id, which, control) {
    var NS = "http://www.w3.org/2000/svg";
    var surf = cfg.colors.surface || "#12151c", acc = cfg.colors.accent || "#2f7bd6";
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", lx); c.setAttribute("cy", ly); c.setAttribute("r", control ? 8 : 9);
    c.setAttribute("fill", control ? acc : surf);
    c.setAttribute("stroke", control ? surf : acc);
    c.setAttribute("stroke-width", 3);
    c.setAttribute("class", "tb-handle");
    c.addEventListener("pointerdown", function (e) { beginHandleDrag(c, id, which, e); });
    plane.appendChild(c);
  }
  function addHandle(px, py, id, which) {
    var loc = pitchToLocal(px, py);
    makeHandle(loc.x, loc.y, id, which, false);
  }

  function wireObjects() {
    var groups = svg.querySelectorAll("[data-oid]");
    if (!groups.length) { plane = svg; return; }
    plane = groups[0].parentNode;                       // shared pitch-plane coordinate space
    groups.forEach(function (g) {
      var id = g.getAttribute("data-oid");
      var meta = metaOf(id);
      var kind = meta ? meta.type : "";
      if (meta && meta.locked) g.classList.add("locked");
      g.style.touchAction = "none";
      g.addEventListener("pointerdown", function (e) { beginObjectDrag(g, id, kind, e); });
    });

    // drawSelectionDecor) so selecting is instant and never round-trips to Python.
    drawSelectionDecor();
  }

  // ---- marquee / box selection (empty-pitch drag) -------------------------------
  function beginMarquee(e) {
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) { if (cfg.selectedId != null) select(null); return; }
    var start = toPlaneWith(inv, e.clientX, e.clientY);
    var add = e.shiftKey;                                  // shift = add hits to current selection
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var box = document.createElementNS(NS, "rect");
    box.setAttribute("fill", acc); box.setAttribute("fill-opacity", "0.10");
    box.setAttribute("stroke", acc); box.setAttribute("stroke-width", "1.5");
    box.setAttribute("stroke-dasharray", "5 4"); box.style.pointerEvents = "none";
    plane.appendChild(box);
    var pending = start, raf = 0;
    function paint() {
      raf = 0;
      var x = Math.min(start.x, pending.x), y = Math.min(start.y, pending.y);
      box.setAttribute("x", x); box.setAttribute("y", y);
      box.setAttribute("width", Math.abs(pending.x - start.x));
      box.setAttribute("height", Math.abs(pending.y - start.y));
    }
    function move(ev) { pending = toPlaneWith(inv, ev.clientX, ev.clientY); if (!raf) raf = requestAnimationFrame(paint); }
    function up(ev) {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (box.parentNode) box.parentNode.removeChild(box);
      var end = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (Math.abs(end.x - start.x) < 4 && Math.abs(end.y - start.y) < 4) {   // a click on empty pitch
        if (!add) emitSel([]);                            // clears selection (unchanged intent)
        return;
      }
      var a = localToPitch(start), b = localToPitch(end);
      var x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
      var hits = [];
      objects.forEach(function (o) {                       // hidden objects have no <g> -> not selectable
        if (!groupOf(o.id)) return;
        if (o.x >= x0 && o.x <= x1 && o.y >= y0 && o.y <= y1) hits.push(o.id);
      });
      if (add) {
        var cur = selArray();
        hits.forEach(function (id) { if (cur.indexOf(id) === -1) cur.push(id); });
        emitSel(cur);
      } else {
        emitSel(hits);
      }
    }

  }

  // ---- freehand drawing (capture a sampled path, emit ONE add_object) ------------
  function beginFreehand(e) {
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) return;
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", acc);
    path.setAttribute("stroke-width", "3"); path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round"); path.style.pointerEvents = "none";
    plane.appendChild(path);
    var pts = [toPlaneWith(inv, e.clientX, e.clientY)], raf = 0, aborted = false;
    function dstr() { return "M " + pts.map(function (p) { return p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" L "); }
    function paint() { raf = 0; path.setAttribute("d", dstr()); }
    function move(ev) {
      var p = toPlaneWith(inv, ev.clientX, ev.clientY), last = pts[pts.length - 1];
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) > 8) {   // sample: skip near-duplicate points
        pts.push(p); if (!raf) raf = requestAnimationFrame(paint);
      }
    }
    function cleanup() {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
      document.removeEventListener("keydown", esc, true);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (path.parentNode) path.parentNode.removeChild(path);
    }
    function up(ev) {
      cleanup();
      if (aborted || pts.length < 2) return;              // no partial object persisted
      var pp = pts.map(function (p) { var q = localToPitch(p); return [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10]; });
      emit({ ts: nextTs(), commands: [{ op: "add_object", type: "freehand", x: pp[0][0], y: pp[0][1],
             props: { points: pp, color: "", width: 3, closed: false } }] });
    }
    function esc(ev) { if (ev.key === "Escape") { aborted = true; cleanup(); } }   // cancel, no emit
    document.addEventListener("keydown", esc, true);
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
  }

  function render() {
    applyColors(cfg.colors || {});
    stage.innerHTML = cfg.svg || "";

    wireObjects();
    // empty-pitch pointerdown: draw a new object if a draw tool is armed, else clear selection
    svg.addEventListener("pointerdown", function (e) {
      if (!isEmptyPitch(e)) return;                       // on a piece/handle -> their own drags
      if (cfg.editable && cfg.placeTool) { placeAt(e); return; }   // point-object tool → click to place
      if (cfg.editable && cfg.drawTool) { beginDraw(e); return; }
      if (cfg.editable) { beginMarquee(e); return; }      // drag-to-select (click = clear)
      if (cfg.selectedId != null) select(null);
    });
    renderPalette();
    setHeight();
  }

  // Keyboard editor shortcuts. All go through the SAME intent channel / trust boundary; the
  // JS never mutates the board. Guarded so they never fire while typing in an input/textarea/
  // select/contenteditable, and only when this canvas iframe has focus (the listener lives in
  // the iframe document, so typing in a Streamlit control outside the iframe never reaches it).
  window.addEventListener("keydown", function (e) {
    if (!cfg.editable || isTypingTarget(e.target)) return;
    var ctrl = e.ctrlKey || e.metaKey;
    var key = e.key, sel = selArray();
    if (ctrl && (key === "a" || key === "A")) {           // select all VISIBLE objects on the frame
      e.preventDefault();
      emitSel(objects.map(function (o) { return o.id; }).filter(function (id) { return !!groupOf(id); }));
    } else if (ctrl && (key === "z" || key === "Z") && !e.shiftKey) {
      e.preventDefault();
      emit({ ts: nextTs(), select: "__keep__", commands: [], undo: true });
    } else if (ctrl && ((key === "y" || key === "Y") || ((key === "z" || key === "Z") && e.shiftKey))) {
      e.preventDefault();
      emit({ ts: nextTs(), select: "__keep__", commands: [], redo: true });
    } else if (ctrl && (key === "d" || key === "D")) {
      if (sel.length) { e.preventDefault(); emit({ ts: nextTs(), select: "__keep__", commands: [{ op: "duplicate_objects", ids: sel }] }); }
    } else if (key === "Delete" || key === "Backspace") {
      if (sel.length) {
        e.preventDefault();

        emit({ ts: nextTs(), select: null, commands: [{ op: "delete_objects", ids: sel }] });
      }
    } else if (key === "Escape") {
      e.preventDefault();

        cfg.drawTool = null;

      else if (key === "ArrowUp") dy = -step; else if (key === "ArrowDown") dy = step;

             commands: [{ op: "move_objects", ids: sel, dx: dx, dy: dy }] });
    }
  });

  function escH(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

    return '<div class="fn"><div class="lbl">Text</div></div>'
     +'<div class="sec"><div class="lbl" style="margin-bottom:6px">Text</div><input type="text" data-k="text" value="'+escH(p.text)+'"></div>'
     +'<div class="sec"><div class="lbl" style="margin-bottom:6px">Size</div><div class="row"><input type="range" min="8" max="40" value="'+(p.size||14)+'" data-krange="size" data-scale="1"><span class="val">'+(p.size||14)+'</span></div></div>'
     +'<div class="sec"><div class="row between"><span>Colour</span><input type="color" data-k="color" value="'+(p.color||'#ffffff')+'"></div></div>';
  }
  function editorFor(o){
    if(o.type==='player') return editorPlayer(o);
    if(VECTOR[o.type]) return editorVector(o);
    if(o.type==='zone'||o.type==='shape'||o.type==='circle'||o.type==='highlight') return editorShape(o);
    if(o.type==='text'||o.type==='number') return editorText(o);
    return '<div class="fn"><div class="lbl">'+escH(o.type)+'</div></div><div class="note">No editable settings for this object.</div>';
  }
  function placedList(){
    if(!objects.length) return '<div class="fn"><div class="lbl">File name</div></div><div class="chead"><span class="q">?</span><b>Placed objects</b></div><div class="note">No objects yet. Pick a tool from the rail, then click the pitch to place — or drag to draw a shape/arrow.</div>';
    var rows=objects.map(function(o){ var p=o.props||{};
      var col=(o.type==='player')?(p.color||(p.team==='away'?'#2f6fd6':'#e23b3b')):'#8a8f99';
      var lab=(o.type==='player')?('#'+(p.number!=null?p.number:'')+' '+(p.name||'player')):labelFor(o.type);
      return '<div class="prow" data-id="'+o.id+'"><span class="dot" style="background:'+col+'"></span>'+escH(lab)+'</div>'; }).join('');
    return '<div class="chead"><span class="q">?</span><b>Placed objects ('+objects.length+')</b></div><div class="plist">'+rows+'</div>';
  }
  function toolHint(tool){
    var msg = POINT[tool] ? 'Click on the pitch to place. Keep clicking to add more.' : 'Drag on the pitch to draw, then fine-tune it here.';
    return '<div class="chead"><span class="q">?</span><b>'+labelFor(tool)+'</b></div><div class="note">'+msg+'</div><button class="ghost" id="tb-done">Done</button>';
  }
  function renderCtx(){
    var panel=document.getElementById('ctxpanel'); if(!panel) return;
    var ids=selIds(), obj = ids.length===1 ? objects.find(function(o){return o.id===ids[0];}) : null;
    var toolName=null, html;
    if(obj){ html=editorFor(obj); }
    else if(activeTool && activeTool!=='select' && hasDefaults(activeTool)){
      toolName=activeTool;
      var synth={ id:null, type:toolType(activeTool), props: cfg.toolDefaults[activeTool] || defaultsFor(activeTool) };
      var tip = POINT[activeTool] ? 'Click the pitch to place. These settings stick to every one you add.'
                                  : 'Drag on the pitch to draw. These settings stick to every one you draw.';
      html='<div class="chead"><span class="q">?</span><b>New '+labelFor(activeTool)+'</b></div><div class="note">'+tip+'</div>'+editorFor(synth);
    } else if(activeTool && activeTool!=='select'){ html=toolHint(activeTool); }
    else { html=placedList(); }
    panel.innerHTML = html.replace(/\$ic:(\w+)\$/g,function(m,k){return TB_IC[k]||'';});
    wireCtx(panel, obj, toolName);
    var done=document.getElementById('tb-done'); if(done) done.onclick=function(){ armTool('select'); };
  }
  function wireCtx(panel, obj, toolName){
    if(!obj && !toolName){                                // "Placed objects" list → instant local select
      panel.querySelectorAll('.prow[data-id]').forEach(function(r){ r.onclick=function(){ _applyLocalSel([r.dataset.id]); }; });
      return;
    }
    // a selected object edits the model (update_object); a tool-defaults panel writes the sticky
    // defaults so EVERY object you then add keeps them (colour/style/number…).
    var apply = obj ? function(pr){ emitUpdate(obj.id, pr); }
                    : function(pr){ Object.assign(cfg.toolDefaults[toolName], pr); };
    panel.querySelectorAll('input[data-k]').forEach(function(inp){ inp.onchange=function(){
      var k=inp.dataset.k, v = inp.type==='number' ? (parseInt(inp.value||'0',10)||0) : inp.value;
      var pr={}; pr[k]=v; apply(pr); }; });
    panel.querySelectorAll('input[data-krange]').forEach(function(inp){ var out=inp.parentNode.querySelector('.val');
      inp.oninput=function(){ if(out) out.textContent=inp.value; };
      inp.onchange=function(){ var k=inp.dataset.krange, sc=parseFloat(inp.dataset.scale||'1'); var pr={}; pr[k]=Math.round(parseFloat(inp.value)*sc*1000)/1000; apply(pr); }; });
    panel.querySelectorAll('select[data-k]').forEach(function(s){ s.onchange=function(){ var pr={}; pr[s.dataset.k]=s.value; apply(pr); }; });
    panel.querySelectorAll('[data-seg]').forEach(function(seg){ seg.querySelectorAll('button').forEach(function(b){ b.onclick=function(){
      seg.querySelectorAll('button').forEach(function(x){x.classList.remove('on');}); b.classList.add('on');
      var pr={}; pr[seg.dataset.seg]=b.dataset.v; apply(pr); }; }); });
    panel.querySelectorAll('[data-toggle]').forEach(function(t){ t.onclick=function(){ var on=!t.classList.contains('on'); t.classList.toggle('on',on); var pr={}; pr[t.dataset.toggle]=on; apply(pr); }; });
    panel.querySelectorAll('[data-reset]').forEach(function(b){ b.onclick=function(){ var pr={}; pr[b.dataset.reset]=''; apply(pr); }; });
  }
  function renderChrome(){
    var n=selIds().length, del=document.getElementById('tb-del'), dup=document.getElementById('tb-dup');
    if(del) del.disabled=!n; if(dup) dup.disabled=!n;
    var gr=document.getElementById('tb-grid'); if(gr) gr.classList.toggle('on', !!(cfg.board||{}).grid);
    renderTimeline();
    renderCtx();
  }
  function emitAction(name, p){ emit({ ts: nextTs(), select: "__keep__", commands: [], action: Object.assign({ name: name }, p || {}) }); }
  function openOv(id){ var o=document.getElementById(id); if(o) o.classList.add('show'); }
  function closeOv(id){ var o=document.getElementById(id); if(o) o.classList.remove('show'); }
  function renderTimeline(){
    var b=cfg.board||{}, frames=b.frames||[], idx=b.frame_index||0;
    var fr=document.getElementById('tb-frames'); if(fr) fr.textContent=(idx+1)+'/'+(frames.length||1);
    var el=document.getElementById('tl-frames'); if(!el) return;
    el.innerHTML = (frames.length?frames:[{name:'Frame 1'}]).map(function(f,i){
      return '<button class="tl-chip'+(i===idx?' on':'')+'" data-i="'+i+'">'+escH(f.name||('Frame '+(i+1)))+'</button>'; }).join('');
    el.querySelectorAll('.tl-chip').forEach(function(c){ c.onclick=function(){ emitAction('goto_frame',{index:parseInt(c.dataset.i,10)}); }; });
  }
  var _POSByF={ '4-3-3':['GK','RB','RCB','LCB','LB','RCM','CM','LCM','RW','ST','LW'],
    '4-4-2':['GK','RB','RCB','LCB','LB','RM','RCM','LCM','LM','RCF','LCF'],
    '4-2-3-1':['GK','RB','RCB','LCB','LB','RDM','LDM','RAM','CAM','LAM','ST'],
    '3-5-2':['GK','RCB','CB','LCB','RWB','RCM','CM','LCM','LWB','RCF','LCF'] };
  var formTeam='home', formFormation='';
  function buildFormBody(){
    var b=cfg.board||{}, fs=b.formations||['4-3-3','4-2-3-1','4-4-2','3-5-2'];
    var f=formFormation||fs[0]; formFormation=f; var pos=_POSByF[f]||_POSByF['4-3-3'];
    var opts=fs.map(function(x){return '<option '+(x===f?'selected':'')+'>'+x+'</option>';}).join('');
    var rows=pos.map(function(p){return '<div class="mrow"><input class="fnm" placeholder="name"><input class="fno" placeholder="no."><span class="fpos">'+p+'</span></div>';}).join('');
    var body=document.getElementById('form-body');
    body.innerHTML='<div class="ftabs"><button class="'+(formTeam==='home'?'on':'')+'" data-t="home">Home</button><button class="'+(formTeam==='away'?'on':'')+'" data-t="away">Away</button></div>'
      +'<div class="frow2"><span class="slbl" style="margin:0 6px 0 0">Formation</span><select id="fsel">'+opts+'</select></div>'
      +'<div class="flist">'+rows+'</div>'
      +'<button class="mpill" id="fplace" style="width:100%;margin-top:14px;padding:12px;font-size:14px">＋  Add '+formTeam+' team to the pitch</button>';
    body.querySelectorAll('.ftabs button').forEach(function(bb){ bb.onclick=function(){ formTeam=bb.dataset.t; buildFormBody(); }; });
    body.querySelector('#fsel').onchange=function(){ formFormation=this.value; buildFormBody(); };
    body.querySelector('#fplace').onclick=function(){
      var rws=[].map.call(body.querySelectorAll('.flist .mrow'), function(r,i){ return { name:r.querySelector('.fnm').value, number:r.querySelector('.fno').value, pos:pos[i] }; });
      emitAction('formation',{ team:formTeam, formation:formFormation, rows:rws }); closeOv('ov-form');
    };
  }
  function buildSetBody(){
    var b=cfg.board||{}, c=b.colors||{};
    var body=document.getElementById('set-body');
    body.innerHTML=
       '<div class="slbl">Team kits</div>'
      +'<div class="mrow2"><span><span class="cdot" style="background:'+(c.home||'#e23b3b')+'"></span> Home team colour</span><input type="color" id="s-home" value="'+(c.home||'#e23b3b')+'"></div>'
      +'<div class="mrow2"><span><span class="cdot" style="background:'+(c.away||'#2f6fd6')+'"></span> Away team colour</span><input type="color" id="s-away" value="'+(c.away||'#2f6fd6')+'"></div>'
      +'<div class="slbl" style="margin-top:14px">Pitch</div>'
      +'<div class="mrow2"><span>Pitch colour</span><input type="color" id="s-grass" value="'+(c.grass||'#ffffff')+'"></div>'
      +'<div class="mrow2"><span>Line colour</span><input type="color" id="s-line" value="'+(c.line||'#14181f')+'"></div>'
      +'<div class="mrow2"><span>Grid lines</span><button class="toggle '+(b.grid?'on':'')+'" id="s-grid"></button></div>'
      +'<div class="mrow2"><span>Orientation</span><button class="mghost" id="s-orient">'+(b.orientation==='vertical'?'Vertical':'Horizontal')+' — flip</button></div>'
      +'<div class="mrow2"><span>New board</span><button class="mghost" id="s-new">Clear</button></div>';
    function col(id, key){ var el=body.querySelector(id); el.onchange=function(){ var o={}; o[key]=el.value; emitAction('set_colors', o); }; }
    col('#s-home','home'); col('#s-away','away'); col('#s-grass','grass'); col('#s-line','line');
    body.querySelector('#s-grid').onclick=function(){ emitAction('grid',{on:!b.grid}); closeOv('ov-set'); };
    body.querySelector('#s-orient').onclick=function(){ emitAction('orientation'); closeOv('ov-set'); };
    body.querySelector('#s-new').onclick=function(){ emitAction('new'); closeOv('ov-set'); };
  }
  function initChrome(){
    ['#topbar','#toolrail','#timeline','#ov-form','#ov-set'].forEach(function(sel){ var el=document.querySelector(sel);
      if(el) el.innerHTML=el.innerHTML.replace(/\$ic:(\w+)\$/g,function(m,k){return TB_IC[k]||'';}); });
    document.querySelectorAll('#toolrail .tool').forEach(function(b){ b.addEventListener('click',function(){ armTool(b.dataset.tool); }); });
    var U=document.getElementById('tb-undo'),R=document.getElementById('tb-redo'),D=document.getElementById('tb-del'),P=document.getElementById('tb-dup');
    if(U) U.onclick=function(){ emit({ts:nextTs(),select:"__keep__",commands:[],undo:true}); };
    if(R) R.onclick=function(){ emit({ts:nextTs(),select:"__keep__",commands:[],redo:true}); };
    if(D) D.onclick=function(){ var ids=selIds(); if(ids.length) emit({ts:nextTs(),select:null,commands:[{op:"delete_objects",ids:ids}]}); };
    if(P) P.onclick=function(){ var ids=selIds(); if(ids.length) emit({ts:nextTs(),select:"__keep__",commands:[{op:"duplicate_objects",ids:ids}]}); };
    var NW=document.getElementById('tb-new'); if(NW) NW.onclick=function(){ emitAction('new'); };
    var GR=document.getElementById('tb-grid'); if(GR) GR.onclick=function(){ emitAction('grid',{on:!((cfg.board||{}).grid)}); };
    var OR=document.getElementById('tb-orient'); if(OR) OR.onclick=function(){ emitAction('orientation'); };
    var FM=document.getElementById('tb-form'); if(FM) FM.onclick=function(){ formTeam='home'; formFormation=''; buildFormBody(); openOv('ov-form'); };
    var ST=document.getElementById('tb-set'); if(ST) ST.onclick=function(){ buildSetBody(); openOv('ov-set'); };
    var PV=document.getElementById('tl-prev'); if(PV) PV.onclick=function(){ var i=((cfg.board||{}).frame_index||0)-1; if(i>=0) emitAction('goto_frame',{index:i}); };
    var AF=document.getElementById('tl-add'); if(AF) AF.onclick=function(){ emitAction('add_frame'); };
    var DF=document.getElementById('tl-del'); if(DF) DF.onclick=function(){ emitAction('del_frame'); };
    document.querySelectorAll('.ov .x[data-close]').forEach(function(x){ x.onclick=function(){ closeOv(x.getAttribute('data-close')); }; });
    document.querySelectorAll('.ov').forEach(function(o){ o.addEventListener('click',function(e){ if(e.target===o) closeOv(o.id); }); });
    renderChrome();
  }

  var lastNonce = null;                     // the board version we last drew (see below)
  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    // Streamlit re-delivers "streamlit:render" on EVERY app rerun — including reruns triggered
    // by unrelated widgets, and (crucially) right after this component posts a value, BEFORE
    // Python has applied it. The old code rebuilt the whole SVG (stage.innerHTML = svg) on every
    // one of those, which reset the piece the user had just dragged back to its previous position
    // (the "snap-back") and churned/froze the board. The nonce is an exact content signature of
    // the board + interaction state, so an unchanged nonce means nothing visible changed → ignore
    // the (stale/duplicate) render entirely and keep the user's current, in-progress positions.
    var nonce = (args.nonce != null) ? String(args.nonce) : null;
    if (nonce !== null && nonce === lastNonce && stage.querySelector("svg")) {
      setHeight();
      return;
    }
    lastNonce = nonce;
    cfg.svg = args.svg || "";
    cfg.editable = args.editable !== false;
    cfg.snap = Number(args.snap || 0);
    cfg.colors = args.colors || {};
    cfg.palette = args.palette || [];
    if (args.draw_tool) cfg.drawTool = args.draw_tool;   // Python-armed tool (kept in sync)
    cfg.board = args.board_state || cfg.board || {};     // frames / grid / orientation for the chrome
    objects = args.objects || [];
    // Selection is client-owned (never sent to Python). On a re-render we KEEP the local
    // selection — only dropping ids that no longer exist — and auto-select a freshly-added
    // object (exactly one new id since the last render), so "place then set its number" works.
    var curIds = {}; objects.forEach(function(o){ curIds[o.id] = 1; });
    var added = objects.filter(function(o){ return !_prevIds[o.id]; });
    cfg.selectedIds = (cfg.selectedIds || []).filter(function(id){ return curIds[id]; });
    if (added.length === 1) cfg.selectedIds = [added[0].id];
    cfg.selectedId = cfg.selectedIds.length ? cfg.selectedIds[cfg.selectedIds.length - 1] : null;
    _prevIds = curIds;
    render();
    renderChrome();                          // refresh the in-board panels for the new state
  });

  window.addEventListener("resize", setHeight);
  if (window.ResizeObserver) { new ResizeObserver(setHeight).observe(document.body); }
  initChrome();                              // build the Tacticalista-style chrome once
  ready();
  window.addEventListener("load", setHeight);
})();
</script>
</body>
</html>
