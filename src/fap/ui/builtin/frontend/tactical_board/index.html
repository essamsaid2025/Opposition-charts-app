<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; --accent: #2f7bd6; --border: #232733;
    --surface: #12151c; --text: #eef2f7; --muted: #8a93a2; --chip: #1b2029; }
  html, body { margin: 0; padding: 0; background: transparent;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #wrap { display: flex; flex-direction: column; gap: 8px; }

  /* palette rail -------------------------------------------------- */
  #palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
    color: var(--text); font-size: 12px; font-weight: 600; cursor: grab;
    user-select: none; touch-action: none; transition: border-color .12s, box-shadow .12s;
  }
  .chip:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .chip.disabled { opacity: .45; cursor: not-allowed; }

  /* board --------------------------------------------------------- */
  #stage { position: relative; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border); background: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,.35); }
  /* #stage is made focusable (tabindex=0 in JS) so the iframe gains keyboard focus on click and
     the window keydown handler (Delete/Backspace/Escape) actually receives events — without a
     visible focus ring, which would look wrong around the pitch. */
  #stage:focus, #stage:focus-visible { outline: none; }
  #stage svg.tb-board-svg { display: block; width: 100%; height: auto; }
  #stage [data-oid] { cursor: grab; }
  #stage [data-oid].locked { cursor: not-allowed; }
  #stage [data-oid].dragging { cursor: grabbing; }
  .tb-handle { cursor: grab; }
  #hint { font-size: 11px; color: var(--muted); padding: 0 2px; }

  /* drag ghost following the cursor when adding from the palette --- */
  #ghost { position: fixed; pointer-events: none; z-index: 9; width: 30px; height: 30px;
    border-radius: 50%; border: 2px solid #fff; transform: translate(-50%, -50%);
    display: none; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div id="wrap">
  <div id="palette"></div>
  <div id="stage"></div>
  <div id="hint">Drag pieces to move them. Drag a chip onto the pitch to add. Click to select · Delete removes.</div>
</div>
<div id="ghost"></div>
<script>
(function () {
  // ---- Streamlit static-component bridge (same protocol as studio/sortable) ----
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function ready() { send("streamlit:componentReady", { apiVersion: 1 }); }
  function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 2 }); }
  function emit(payload) {
    // payload carries INTENT ONLY: commands + selection. Python owns the state.
    send("streamlit:setComponentValue", { dataType: "json", value: payload });
  }

  // board is authored in a fixed 1050 x 680 plane (10px per pitch unit) — mirrors render.py
  var PLANE_W = 1050, PLANE_H = 680;

  var stage = document.getElementById("stage");
  var paletteEl = document.getElementById("palette");
  var ghost = document.getElementById("ghost");

  // Keyboard focus: the Delete/Backspace/Escape handler is a `window` keydown listener, which only
  // fires while THIS iframe is the browser's focused frame. Clicking a piece never focused the
  // frame (every pointerdown handler calls preventDefault, which also suppresses the default
  // focus-shift to the clicked frame), so the shortcuts silently did nothing. Making #stage a
  // focus target (tabindex 0) and explicitly focusing it on any pointerdown fixes that. focus()
  // is programmatic, so it is NOT affected by the existing preventDefault calls (those stay).
  // preventScroll:true so grabbing focus never scrolls the surrounding Streamlit page.
  stage.tabIndex = 0;
  function focusStage() { try { stage.focus({ preventScroll: true }); } catch (_) {} }
  // Capture phase = runs before the piece/handle/empty-pitch pointerdown handlers, covering every
  // interaction inside the pitch (select, drag, rotate, resize, draw) in ONE place.
  stage.addEventListener("pointerdown", focusStage, true);

  var svg = null, plane = null;          // <svg> and the element whose local space == pitch plane
  var objects = [];                       // [{id,type,x,y,x2,y2,locked}] — metadata only, for handles
  var cfg = { editable: true, snap: 0, selectedId: null, selectedIds: [], colors: {}, palette: [], drawTool: null };
  // strictly-increasing, session-unique action stamp. Date.now() only moves forward, so
  // even if Streamlit remounts the iframe (resetting JS state) a later action never
  // reuses an earlier stamp - this is what lets Python dedup re-delivered values without
  // ever swallowing a real drop or double-applying a non-idempotent add.
  var lastTs = 0;
  function nextTs() { var t = Date.now(); if (t <= lastTs) t = lastTs + 1; lastTs = t; return t; }

  var VECTOR = { arrow: 1, curved_arrow: 1, dashed_arrow: 1, line: 1 };

  function applyColors(colors) {
    var root = document.documentElement.style;
    var map = ["accent", "border", "surface", "text", "muted", "chip"];
    map.forEach(function (k) { if (colors[k]) root.setProperty("--" + k, colors[k]); });
  }

  // ---- coordinate mapping: client px -> pitch 0..100 (orientation-agnostic) -----
  // `plane` is the direct parent of the object groups. In BOTH orientations its local
  // coordinate space is the 1050x680 pitch plane (the vertical board only rotates that
  // whole plane via an ancestor <g>), so getScreenCTM() handles orientation for free.
  function toPlane(clientX, clientY, ref) {
    var m = (ref || plane).getScreenCTM();
    if (!m) return null;
    var pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    var p = pt.matrixTransform(m.inverse());
    return { x: p.x, y: p.y };
  }
  // Drag-time coordinate mapping: the plane's screen transform does NOT change mid-drag
  // (no pan/zoom while dragging), so we snapshot the INVERSE CTM once at drag start and
  // reuse it for every pointermove - avoiding a fresh getScreenCTM()+inverse() (an
  // expensive matrix recompute) on each of the many pointermove events during a fast drag.
  function planeInverseCTM(ref) {
    var m = (ref || plane).getScreenCTM();
    return m ? m.inverse() : null;
  }
  function toPlaneWith(inv, clientX, clientY) {
    var pt = svg.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    var p = pt.matrixTransform(inv);
    return { x: p.x, y: p.y };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function toPitch(local) {
    var x = clamp(local.x / PLANE_W * 100, 0, 100);
    var y = clamp(local.y / PLANE_H * 100, 0, 100);
    if (cfg.snap && cfg.snap > 0) {
      x = Math.round(x / cfg.snap) * cfg.snap;
      y = Math.round(y / cfg.snap) * cfg.snap;
    }
    return { x: Math.round(x * 100) / 100, y: Math.round(y * 100) / 100 };
  }
  function pitchToLocal(px, py) { return { x: px / 100 * PLANE_W, y: py / 100 * PLANE_H }; }

  // ---- curved-arrow control point (MIRRORS render.py curve_control_point / its inverse) --
  // Both operate in the plane's local (1050x680) space, exactly like the Python renderer,
  // so the on-canvas curve handle sits on the visible curve and a drag maps back to the same
  // `curvature` scalar Python stores. Keep these in lock-step with render.py.
  function curveControlPoint(s, e, k) {
    return { x: (s.x + e.x) / 2 + (e.y - s.y) * k,
             y: (s.y + e.y) / 2 - (e.x - s.x) * k };
  }
  function curvatureFromControlPoint(s, e, cx, cy) {
    var dx = e.x - s.x, dy = e.y - s.y, denom = dx * dx + dy * dy;
    if (denom === 0) return 0;
    var mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
    return ((cx - mx) * dy - (cy - my) * dx) / denom;
  }

  function metaOf(id) { for (var i = 0; i < objects.length; i++) if (objects[i].id === id) return objects[i]; return null; }

  function localToPitch(loc) { return { x: loc.x / PLANE_W * 100, y: loc.y / PLANE_H * 100 }; }

  // ---- selection (UI-only intent; never a board mutation) -----------------------
  // Selection is a SET of ids held in cfg.selectedIds (session/UI state only). cfg.selectedId
  // stays the "primary" (last-added) so the existing rotate/resize/endpoint handles keep working
  // for a single selection. Everything below emits the SAME `select` intent the trust boundary
  // already accepts (a string for one, a string[] for many).
  function selArray() {
    if (cfg.selectedIds && cfg.selectedIds.length) return cfg.selectedIds.slice();
    return cfg.selectedId != null ? [cfg.selectedId] : [];
  }
  function emitSel(ids) {
    cfg.selectedIds = ids.slice();
    cfg.selectedId = ids.length ? ids[ids.length - 1] : null;
    focusStage();
    emit({ ts: nextTs(), select: ids.length === 1 ? ids[0] : ids.slice(), commands: [] });
  }
  function select(id) {                 // single-select (used by handle/endpoint drags)
    cfg.selectedId = id;
    cfg.selectedIds = id != null ? [id] : [];
    focusStage();                       // ensure Delete/Backspace reach the keydown handler
    emit({ ts: nextTs(), select: id === undefined ? null : id, commands: [] });
  }
  function isTypingTarget(t) {
    if (!t) return false;
    var tn = (t.tagName || "").toLowerCase();
    return tn === "input" || tn === "textarea" || tn === "select" || t.isContentEditable === true;
  }

  // ---- object dragging ----------------------------------------------------------
  function beginGroupDrag(ids, e) {
    // Move EVERY selected (non-locked) object by one shared delta -> ONE move_objects
    // command (one undo step). Locked members stay put. Never mutates the model in JS.
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) return;
    var start = toPlaneWith(inv, e.clientX, e.clientY);
    var items = [];
    ids.forEach(function (mid) {
      var m = metaOf(mid);
      if (!m || m.locked) return;
      var g = groupOf(mid);
      if (g) items.push({ id: mid, g: g, orig: g.getAttribute("transform") || "" });
    });
    if (!items.length) return;
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var pending = null, raf = 0;
    function paint() {
      raf = 0; if (!pending) return;
      var ddx = pending.x - start.x, ddy = pending.y - start.y;      // local px delta
      items.forEach(function (it) {
        it.g.setAttribute("transform", "translate(" + ddx + " " + ddy + ") " + it.orig);
      });
    }
    function move(ev) { pending = toPlaneWith(inv, ev.clientX, ev.clientY); if (!raf) raf = requestAnimationFrame(paint); }
    function up(ev) {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      var end = toPlaneWith(inv, ev.clientX, ev.clientY);
      var d = localToPitch({ x: end.x - start.x, y: end.y - start.y });   // raw pitch-unit delta
      emit({ ts: nextTs(), select: ids.slice(),
             commands: [{ op: "move_objects", ids: items.map(function (it) { return it.id; }),
                          dx: d.x, dy: d.y }] });
    }
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
  }

  function beginObjectDrag(group, id, kind, e) {
    if (!cfg.editable) { select(id); return; }
    if (e.shiftKey) {                    // shift-click toggles this object's selection membership
      e.preventDefault();
      var cur = selArray(), i = cur.indexOf(id);
      if (i === -1) cur.push(id); else cur.splice(i, 1);
      emitSel(cur);
      return;
    }
    var multi = selArray();
    if (multi.length > 1 && multi.indexOf(id) !== -1) {   // drag any member -> move the whole group
      beginGroupDrag(multi, e);
      return;
    }
    var meta = metaOf(id);
    if (meta && meta.locked) { select(id); return; }
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) return;
    var start = toPlaneWith(inv, e.clientX, e.clientY);
    var origin = pitchToLocal(meta ? meta.x : 50, meta ? meta.y : 50); // object anchor in plane
    var grab = { dx: start.x - origin.x, dy: start.y - origin.y };     // preserve grab offset
    var orig = group.getAttribute("transform") || "";
    group.classList.add("dragging");
    try { group.setPointerCapture(e.pointerId); } catch (x) {}

    // Coalesce rapid pointermove events into at most one DOM write per animation frame:
    // we stash the latest pointer position on every move but only touch the SVG inside a
    // requestAnimationFrame callback (guarded so we schedule at most one per frame).
    var pending = null, raf = 0;
    function paint() {
      raf = 0;
      if (!pending) return;
      var dx = (pending.x - grab.dx) - origin.x;
      var dy = (pending.y - grab.dy) - origin.y;
      group.setAttribute("transform", "translate(" + dx + " " + dy + ") " + orig);
    }
    function move(ev) {
      pending = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (!raf) raf = requestAnimationFrame(paint);
    }
    function up(ev) {
      group.removeEventListener("pointermove", move);
      group.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      group.classList.remove("dragging");
      var now = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (!now) { group.setAttribute("transform", orig); select(id); return; }
      var pit = toPitch({ x: now.x - grab.dx, y: now.y - grab.dy });
      // Do NOT snap the piece back to `orig`. Python remains authoritative: we send the
      // committed x/y and the board re-renders this whole SVG at that position. Leaving
      // the piece where it was dropped means it never visibly jumps back while the
      // (asynchronous) Streamlit round-trip completes - the committed re-render simply
      // replaces it in place. Resetting here was the snap-back bug.
      emit({ ts: nextTs(), select: id, commands: [{ op: "update_object", id: id, x: pit.x, y: pit.y }] });
    }
    group.addEventListener("pointermove", move);
    group.addEventListener("pointerup", up);
  }

  // ---- arrow / line endpoint + curve-control dragging ---------------------------
  // `which` is "start" | "end" | "control". Start/end drag the arrow endpoints; control
  // drags the quadratic curve handle of a curved_arrow and re-derives the `curvature`
  // scalar (inverse of render.py's control-point formula) so Python stays authoritative.
  function beginHandleDrag(circle, id, which, e) {
    if (!cfg.editable) return;
    e.preventDefault(); e.stopPropagation();
    var inv = planeInverseCTM();
    if (!inv) return;
    try { circle.setPointerCapture(e.pointerId); } catch (x) {}
    // fixed endpoints (local space) - only needed to invert the curve handle position
    var meta = metaOf(id);
    var lineS = meta ? pitchToLocal(meta.x, meta.y) : null;
    var lineE = meta ? pitchToLocal(meta.x2 != null ? meta.x2 : meta.x + 12,
                                    meta.y2 != null ? meta.y2 : meta.y) : null;
    // RAF-throttle the visual handle update: stash latest pointer, write cx/cy once a frame
    var pending = null, raf = 0;
    function paint() {
      raf = 0;
      if (!pending) return;
      circle.setAttribute("cx", pending.x); circle.setAttribute("cy", pending.y);
    }
    function move(ev) {
      pending = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (!raf) raf = requestAnimationFrame(paint);
    }
    function up(ev) {
      circle.removeEventListener("pointermove", move);
      circle.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      var loc = toPlaneWith(inv, ev.clientX, ev.clientY);
      var cmd;
      if (which === "control" && lineS && lineE) {
        var k = curvatureFromControlPoint(lineS, lineE, loc.x, loc.y);
        k = Math.max(-1, Math.min(1, Math.round(k * 100) / 100));  // match the -100..100 slider
        cmd = { op: "update_object", id: id, props: { curvature: k } };
      } else {
        var pit = toPitch(loc);
        cmd = which === "start"
          ? { op: "update_object", id: id, x: pit.x, y: pit.y }
          : { op: "update_object", id: id, props: { x2: pit.x, y2: pit.y } };
      }
      emit({ ts: nextTs(), select: id, commands: [cmd] });
    }
    circle.addEventListener("pointermove", move);
    circle.addEventListener("pointerup", up);
  }

  // ---- palette drag-to-add ------------------------------------------------------
  function beginPaletteDrag(chip, item, e) {
    if (!cfg.editable) return;
    e.preventDefault();
    ghost.style.background = item.color || "var(--accent)";
    ghost.style.display = "block";
    ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px";
    try { chip.setPointerCapture(e.pointerId); } catch (x) {}
    // ghost-follow uses clientX/clientY directly (no CTM), but still RAF-throttle the DOM
    // writes so a rapid drag coalesces to one style update per frame.
    var pending = null, raf = 0;
    function paint() {
      raf = 0;
      if (!pending) return;
      ghost.style.left = pending.x + "px"; ghost.style.top = pending.y + "px";
    }
    function move(ev) {
      pending = { x: ev.clientX, y: ev.clientY };
      if (!raf) raf = requestAnimationFrame(paint);
    }
    function up(ev) {
      chip.removeEventListener("pointermove", move);
      chip.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      ghost.style.display = "none";
      var r = stage.getBoundingClientRect();
      var inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
      if (!inside) return;                              // dropped off the pitch -> no-op
      var loc = toPlane(ev.clientX, ev.clientY); if (!loc) return;
      var pit = toPitch(loc);
      emit({ ts: nextTs(), commands: [{ op: "add_object", type: item.type, x: pit.x, y: pit.y,
                                        props: item.props || {} }] });
    }
    chip.addEventListener("pointermove", move);
    chip.addEventListener("pointerup", up);
  }

  // ---- draw mode: click-drag on empty pitch to CREATE an object at the drawn size/dir ----
  // Emits the exact same {op:"add_object", type, x, y, props} shape as beginPaletteDrag, just
  // with geometry computed from the drag instead of type defaults. Only ever fires when a
  // draw tool is armed AND the pointerdown is on empty pitch (isEmptyPitch), so it never
  // interferes with piece/handle/palette dragging or the no-tool clear-selection behaviour.
  var DRAW_MIN = 3;                                        // min drawn size (pitch units)
  function isEmptyPitch(e) {
    return e.target === svg || (e.target.tagName === "rect" && !e.target.closest("[data-oid]"));
  }
  function beginDraw(e) {
    e.preventDefault();
    if (cfg.drawTool && cfg.drawTool.type === "freehand") { beginFreehand(e); return; }
    var inv = planeInverseCTM();                           // cache the CTM ONCE (same discipline)
    if (!inv) return;
    var tool = cfg.drawTool, isVec = !!VECTOR[tool.type];
    var start = toPlaneWith(inv, e.clientX, e.clientY);    // local plane coords
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    // transient preview element (dashed + translucent so it reads as "not committed yet")
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var tag = !isVec ? "rect" : (tool.type === "curved_arrow" ? "path" : "line");
    var preview = document.createElementNS(NS, tag);
    preview.setAttribute("fill", isVec ? "none" : acc);
    if (!isVec) preview.setAttribute("fill-opacity", "0.15");
    preview.setAttribute("stroke", acc);
    preview.setAttribute("stroke-width", isVec ? "4" : "2");
    preview.setAttribute("stroke-dasharray", "6 5");
    preview.style.pointerEvents = "none";
    plane.appendChild(preview);

    var pending = start, raf = 0;
    function paint() { raf = 0; drawPreview(preview, tool, start, pending, isVec); }
    function move(ev) {
      pending = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (!raf) raf = requestAnimationFrame(paint);
    }
    function up(ev) {
      svg.removeEventListener("pointermove", move);
      svg.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (preview.parentNode) preview.parentNode.removeChild(preview);   // ALWAYS remove preview
      emitDraw(tool, start, toPlaneWith(inv, ev.clientX, ev.clientY), isVec);
    }
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerup", up);
  }
  function drawPreview(el, tool, s, cur, isVec) {
    if (!isVec) {
      el.setAttribute("x", Math.min(s.x, cur.x)); el.setAttribute("y", Math.min(s.y, cur.y));
      el.setAttribute("width", Math.abs(cur.x - s.x)); el.setAttribute("height", Math.abs(cur.y - s.y));
      el.setAttribute("rx", 6);
    } else if (tool.type === "curved_arrow") {
      var k = (tool.props && tool.props.curvature != null) ? tool.props.curvature : 0.0;
      var cp = curveControlPoint(s, cur, k);
      el.setAttribute("d", "M " + s.x + " " + s.y + " Q " + cp.x + " " + cp.y + " " + cur.x + " " + cur.y);
    } else {
      el.setAttribute("x1", s.x); el.setAttribute("y1", s.y);
      el.setAttribute("x2", cur.x); el.setAttribute("y2", cur.y);
    }
  }
  function emitDraw(tool, s, end, isVec) {
    var p1 = toPitch(s), p2 = toPitch(end);               // both snapped/clamped in pitch space
    var props = Object.assign({}, tool.props || {});
    var cx, cy;
    if (!isVec) {
      var w = Math.abs(p2.x - p1.x), h = Math.abs(p2.y - p1.y);
      if (w < DRAW_MIN && h < DRAW_MIN) {                  // a click (near-zero) -> default size
        w = (tool.props && tool.props.w) || 20; h = (tool.props && tool.props.h) || 16;
      } else { w = Math.max(w, DRAW_MIN); h = Math.max(h, DRAW_MIN); }
      cx = (p1.x + p2.x) / 2; cy = (p1.y + p2.y) / 2;
      props.w = Math.round(w * 100) / 100; props.h = Math.round(h * 100) / 100;
    } else {
      cx = p1.x; cy = p1.y;
      var x2 = p2.x, y2 = p2.y;
      if (Math.abs(x2 - cx) < DRAW_MIN && Math.abs(y2 - cy) < DRAW_MIN) {
        x2 = clamp(cx + 12, 0, 100); y2 = cy;             // near-zero drag -> short default vector
      }
      props.x2 = x2; props.y2 = y2;
    }
    emit({ ts: nextTs(), commands: [{ op: "add_object", type: tool.type, x: cx, y: cy, props: props }] });
  }

  function renderPalette() {
    paletteEl.innerHTML = "";
    (cfg.palette || []).forEach(function (item) {
      var chip = document.createElement("div");
      chip.className = "chip" + (cfg.editable ? "" : " disabled");
      var dot = document.createElement("span"); dot.className = "dot";
      dot.style.background = item.color || "var(--accent)";
      var label = document.createElement("span"); label.textContent = item.label || item.type;
      chip.appendChild(dot); chip.appendChild(label);
      if (cfg.editable) {
        chip.addEventListener("pointerdown", function (e) { beginPaletteDrag(chip, item, e); });
      }
      paletteEl.appendChild(chip);
    });
    paletteEl.style.display = (cfg.palette && cfg.palette.length) ? "flex" : "none";
  }

  // ---- overlay handles for the selected vector object ---------------------------
  // control=true renders the curve handle inverted (filled accent) so it reads as a
  // distinct grab point from the hollow endpoint handles.
  // ---- rotate + resize handles (any selected object; resize only for zone/shape) --------
  // Same mechanism as the curve handle: SVG shapes appended to `plane`, dragged with a
  // cached inverse CTM + RAF throttling, emitting the SAME update_object command on release.
  var ROTATE_COL = "#2ea043";                             // green: distinct from accent handles

  function groupOf(id) {                                   // the object's <g data-oid> in the live SVG
    var gs = svg.querySelectorAll("[data-oid]");
    for (var i = 0; i < gs.length; i++) if (gs[i].getAttribute("data-oid") === id) return gs[i];
    return null;
  }
  // rotate a vector by deg using render.py's SVG convention (clockwise-positive, y-down)
  function rotVec(vx, vy, deg) {
    var r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
    return { x: vx * c - vy * s, y: vx * s + vy * c };
  }
  function rotateDist(sel) {                               // handle offset from centre (local px)
    var shape = sel.type === "zone" || sel.type === "highlight" || sel.type === "shape";
    return shape ? (sel.h / 100 * PLANE_H) / 2 + 28 : 40;
  }

  function addRotateHandle(sel) {
    var NS = "http://www.w3.org/2000/svg";
    var acc = cfg.colors.accent || "#2f7bd6", surf = cfg.colors.surface || "#12151c";
    var c = pitchToLocal(sel.x, sel.y), d = rotateDist(sel);
    var off = rotVec(0, -d, sel.rotation || 0);           // "up" (0deg) rotated by current rotation
    var hx = c.x + off.x, hy = c.y + off.y;
    var stem = document.createElementNS(NS, "line");      // dashed stem from centre to the grab
    stem.setAttribute("x1", c.x); stem.setAttribute("y1", c.y);
    stem.setAttribute("x2", hx); stem.setAttribute("y2", hy);
    stem.setAttribute("stroke", acc); stem.setAttribute("stroke-width", 2);
    stem.setAttribute("stroke-dasharray", "3 3"); stem.style.pointerEvents = "none";
    stem.setAttribute("class", "tb-handle-stem"); plane.appendChild(stem);
    var h = document.createElementNS(NS, "circle");
    h.setAttribute("cx", hx); h.setAttribute("cy", hy); h.setAttribute("r", 8);
    h.setAttribute("fill", ROTATE_COL); h.setAttribute("stroke", surf); h.setAttribute("stroke-width", 2.5);
    h.setAttribute("class", "tb-handle tb-rotate");
    h.addEventListener("pointerdown", function (e) { beginRotateDrag(h, stem, sel, e); });
    plane.appendChild(h);
  }

  function beginRotateDrag(handle, stem, sel, e) {
    if (!cfg.editable || sel.locked) return;
    e.preventDefault(); e.stopPropagation();
    var inv = planeInverseCTM(); if (!inv) return;
    var c = pitchToLocal(sel.x, sel.y), d = rotateDist(sel), group = groupOf(sel.id);
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    function angleAt(loc) {                                // 0deg = up, clockwise-positive, 0..359
      var deg = Math.atan2(loc.x - c.x, -(loc.y - c.y)) * 180 / Math.PI;
      return ((Math.round(deg) % 360) + 360) % 360;
    }
    var pending = null, raf = 0;
    function paint() {
      raf = 0; if (!pending) return;
      var deg = angleAt(pending), off = rotVec(0, -d, deg);
      handle.setAttribute("cx", c.x + off.x); handle.setAttribute("cy", c.y + off.y);
      stem.setAttribute("x2", c.x + off.x); stem.setAttribute("y2", c.y + off.y);
      if (group) group.setAttribute("transform", "rotate(" + deg + " " + c.x + " " + c.y + ")");
    }
    function move(ev) { pending = toPlaneWith(inv, ev.clientX, ev.clientY); if (!raf) raf = requestAnimationFrame(paint); }
    function up(ev) {
      handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      var deg = angleAt(toPlaneWith(inv, ev.clientX, ev.clientY));
      emit({ ts: nextTs(), select: sel.id, commands: [{ op: "update_object", id: sel.id, rotation: deg }] });
    }
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
  }

  function addResizeHandles(sel) {                         // four bbox-corner handles (rotation-aware)
    var NS = "http://www.w3.org/2000/svg";
    var acc = cfg.colors.accent || "#2f7bd6", surf = cfg.colors.surface || "#12151c";
    var c = pitchToLocal(sel.x, sel.y), th = sel.rotation || 0;
    var halfW = sel.w / 100 * PLANE_W / 2, halfH = sel.h / 100 * PLANE_H / 2;
    [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(function (cn) {
      var sx = cn[0], sy = cn[1], off = rotVec(sx * halfW, sy * halfH, th);
      var h = document.createElementNS(NS, "rect");
      h.setAttribute("x", c.x + off.x - 6); h.setAttribute("y", c.y + off.y - 6);
      h.setAttribute("width", 12); h.setAttribute("height", 12); h.setAttribute("rx", 2);
      h.setAttribute("fill", surf); h.setAttribute("stroke", acc); h.setAttribute("stroke-width", 3);
      h.setAttribute("class", "tb-handle tb-resize");
      h.addEventListener("pointerdown", function (e) { beginResizeDrag(h, sel, sx, sy, e); });
      plane.appendChild(h);
    });
  }

  function beginResizeDrag(handle, sel, sx, sy, e) {
    if (!cfg.editable || sel.locked) return;
    e.preventDefault(); e.stopPropagation();
    var inv = planeInverseCTM(); if (!inv) return;
    var th = sel.rotation || 0;
    // the OPPOSITE corner (fixed anchor) in pitch space; rotation-aware
    var oppRot = rotVec(-sx * sel.w / 2, -sy * sel.h / 2, th);
    var O = { x: sel.x + oppRot.x, y: sel.y + oppRot.y };
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var preview = document.createElementNS(NS, "rect");   // dashed live bounding box
    preview.setAttribute("fill", "none"); preview.setAttribute("stroke", acc);
    preview.setAttribute("stroke-width", 2); preview.setAttribute("stroke-dasharray", "6 5");
    preview.style.pointerEvents = "none"; plane.appendChild(preview);
    function compute(loc) {
      var P = toPitch(loc);                                // pointer, pitch, snapped/clamped
      var dl = rotVec(P.x - O.x, P.y - O.y, -th);          // diagonal in the object's local (un-rotated) frame
      var w = Math.max(Math.abs(dl.x), DRAW_MIN), h = Math.max(Math.abs(dl.y), DRAW_MIN);
      var D = rotVec(dl.x < 0 ? -w : w, dl.y < 0 ? -h : h, th);   // clamped dragged corner back to screen
      var Dx = O.x + D.x, Dy = O.y + D.y;
      return { x: Math.round((O.x + Dx) / 2 * 100) / 100, y: Math.round((O.y + Dy) / 2 * 100) / 100,
               w: Math.round(w * 100) / 100, h: Math.round(h * 100) / 100 };
    }
    var pending = null, raf = 0;
    function paint() {
      raf = 0; if (!pending) return;
      var b = compute(pending), lc = pitchToLocal(b.x, b.y);
      var pw = b.w / 100 * PLANE_W, ph = b.h / 100 * PLANE_H;
      preview.setAttribute("x", lc.x - pw / 2); preview.setAttribute("y", lc.y - ph / 2);
      preview.setAttribute("width", pw); preview.setAttribute("height", ph);
      preview.setAttribute("transform", th ? "rotate(" + th + " " + lc.x + " " + lc.y + ")" : "");
      var dOff = rotVec(sx * pw / 2, sy * ph / 2, th);     // keep the grabbed handle under the pointer
      handle.setAttribute("x", lc.x + dOff.x - 6); handle.setAttribute("y", lc.y + dOff.y - 6);
    }
    function move(ev) { pending = toPlaneWith(inv, ev.clientX, ev.clientY); if (!raf) raf = requestAnimationFrame(paint); }
    function up(ev) {
      handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (preview.parentNode) preview.parentNode.removeChild(preview);   // ALWAYS remove preview
      var b = compute(toPlaneWith(inv, ev.clientX, ev.clientY));
      emit({ ts: nextTs(), select: sel.id,
             commands: [{ op: "update_object", id: sel.id, x: b.x, y: b.y, props: { w: b.w, h: b.h } }] });
    }
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
  }

  function makeHandle(lx, ly, id, which, control) {
    var NS = "http://www.w3.org/2000/svg";
    var surf = cfg.colors.surface || "#12151c", acc = cfg.colors.accent || "#2f7bd6";
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", lx); c.setAttribute("cy", ly); c.setAttribute("r", control ? 8 : 9);
    c.setAttribute("fill", control ? acc : surf);
    c.setAttribute("stroke", control ? surf : acc);
    c.setAttribute("stroke-width", 3);
    c.setAttribute("class", "tb-handle");
    c.addEventListener("pointerdown", function (e) { beginHandleDrag(c, id, which, e); });
    plane.appendChild(c);
  }
  function addHandle(px, py, id, which) {
    var loc = pitchToLocal(px, py);
    makeHandle(loc.x, loc.y, id, which, false);
  }

  function wireObjects() {
    var groups = svg.querySelectorAll("[data-oid]");
    if (!groups.length) { plane = svg; return; }
    plane = groups[0].parentNode;                       // shared pitch-plane coordinate space
    groups.forEach(function (g) {
      var id = g.getAttribute("data-oid");
      var meta = metaOf(id);
      var kind = meta ? meta.type : "";
      if (meta && meta.locked) g.classList.add("locked");
      g.style.touchAction = "none";
      g.addEventListener("pointerdown", function (e) { beginObjectDrag(g, id, kind, e); });
    });
    // handles for the currently-selected object. Vector types keep ONLY their endpoint/curve
    // handles (mutually exclusive - no rotate/resize on arrows). Everything else gets a rotate
    // handle; zone/highlight/shape additionally get corner resize handles. New handles are
    // gated on editable + not locked (endpoint handles already gate the drag in beginHandleDrag).
    // rings for every EXTRA selected object (the primary already gets the Python-drawn ring)
    selArray().forEach(function (sid) {
      if (sid === cfg.selectedId) return;
      var m = metaOf(sid); if (!m) return;
      var lc = pitchToLocal(m.x, m.y);
      var NS = "http://www.w3.org/2000/svg", ac = cfg.colors.accent || "#2f7bd6";
      // solid ring + soft halo — the SAME shape render.py draws for the primary selection
      var halo = document.createElementNS(NS, "circle");
      halo.setAttribute("cx", lc.x); halo.setAttribute("cy", lc.y); halo.setAttribute("r", 28);
      halo.setAttribute("fill", "none"); halo.setAttribute("stroke", ac);
      halo.setAttribute("stroke-width", "6"); halo.setAttribute("stroke-opacity", "0.22");
      halo.style.pointerEvents = "none"; plane.appendChild(halo);
      var ring = document.createElementNS(NS, "circle");
      ring.setAttribute("cx", lc.x); ring.setAttribute("cy", lc.y); ring.setAttribute("r", 24);
      ring.setAttribute("fill", "none"); ring.setAttribute("stroke", ac);
      ring.setAttribute("stroke-width", "2.5");
      ring.style.pointerEvents = "none"; plane.appendChild(ring);
    });
    // rotate/resize/endpoint handles only make sense for a SINGLE selection
    var sel = (selArray().length <= 1) && cfg.selectedId && metaOf(cfg.selectedId);
    if (sel && VECTOR[sel.type]) {
      addHandle(sel.x, sel.y, sel.id, "start");
      addHandle(sel.x2 != null ? sel.x2 : sel.x + 12, sel.y2 != null ? sel.y2 : sel.y, sel.id, "end");
      // curved arrows also get a draggable control-point handle sitting on the current curve
      if (sel.type === "curved_arrow") {
        var s = pitchToLocal(sel.x, sel.y);
        var en = pitchToLocal(sel.x2 != null ? sel.x2 : sel.x + 12,
                              sel.y2 != null ? sel.y2 : sel.y);
        var k = sel.curvature != null ? sel.curvature : 0.3;
        var cp = curveControlPoint(s, en, k);
        makeHandle(cp.x, cp.y, sel.id, "control", true);
      }
    } else if (sel && cfg.editable && !sel.locked) {
      addRotateHandle(sel);
      if (sel.type === "zone" || sel.type === "highlight" || sel.type === "shape"
          || sel.type === "circle") addResizeHandles(sel);
    }
  }

  // ---- marquee / box selection (empty-pitch drag) -------------------------------
  function beginMarquee(e) {
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) { if (cfg.selectedId != null) select(null); return; }
    var start = toPlaneWith(inv, e.clientX, e.clientY);
    var add = e.shiftKey;                                  // shift = add hits to current selection
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var box = document.createElementNS(NS, "rect");
    box.setAttribute("fill", acc); box.setAttribute("fill-opacity", "0.10");
    box.setAttribute("stroke", acc); box.setAttribute("stroke-width", "1.5");
    box.setAttribute("stroke-dasharray", "5 4"); box.style.pointerEvents = "none";
    plane.appendChild(box);
    var pending = start, raf = 0;
    function paint() {
      raf = 0;
      var x = Math.min(start.x, pending.x), y = Math.min(start.y, pending.y);
      box.setAttribute("x", x); box.setAttribute("y", y);
      box.setAttribute("width", Math.abs(pending.x - start.x));
      box.setAttribute("height", Math.abs(pending.y - start.y));
    }
    function move(ev) { pending = toPlaneWith(inv, ev.clientX, ev.clientY); if (!raf) raf = requestAnimationFrame(paint); }
    function up(ev) {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (box.parentNode) box.parentNode.removeChild(box);
      var end = toPlaneWith(inv, ev.clientX, ev.clientY);
      if (Math.abs(end.x - start.x) < 4 && Math.abs(end.y - start.y) < 4) {   // a click on empty pitch
        if (!add) emitSel([]);                            // clears selection (unchanged intent)
        return;
      }
      var a = localToPitch(start), b = localToPitch(end);
      var x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
      var hits = [];
      objects.forEach(function (o) {                       // hidden objects have no <g> -> not selectable
        if (!groupOf(o.id)) return;
        if (o.x >= x0 && o.x <= x1 && o.y >= y0 && o.y <= y1) hits.push(o.id);
      });
      if (add) {
        var cur = selArray();
        hits.forEach(function (id) { if (cur.indexOf(id) === -1) cur.push(id); });
        emitSel(cur);
      } else {
        emitSel(hits);
      }
    }
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
  }

  // ---- freehand drawing (capture a sampled path, emit ONE add_object) ------------
  function beginFreehand(e) {
    e.preventDefault();
    var inv = planeInverseCTM();
    if (!inv) return;
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    var NS = "http://www.w3.org/2000/svg", acc = cfg.colors.accent || "#2f7bd6";
    var path = document.createElementNS(NS, "path");
    path.setAttribute("fill", "none"); path.setAttribute("stroke", acc);
    path.setAttribute("stroke-width", "3"); path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round"); path.style.pointerEvents = "none";
    plane.appendChild(path);
    var pts = [toPlaneWith(inv, e.clientX, e.clientY)], raf = 0, aborted = false;
    function dstr() { return "M " + pts.map(function (p) { return p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" L "); }
    function paint() { raf = 0; path.setAttribute("d", dstr()); }
    function move(ev) {
      var p = toPlaneWith(inv, ev.clientX, ev.clientY), last = pts[pts.length - 1];
      if (Math.abs(p.x - last.x) + Math.abs(p.y - last.y) > 8) {   // sample: skip near-duplicate points
        pts.push(p); if (!raf) raf = requestAnimationFrame(paint);
      }
    }
    function cleanup() {
      svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up);
      document.removeEventListener("keydown", esc, true);
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      if (path.parentNode) path.parentNode.removeChild(path);
    }
    function up(ev) {
      cleanup();
      if (aborted || pts.length < 2) return;              // no partial object persisted
      var pp = pts.map(function (p) { var q = localToPitch(p); return [Math.round(q.x * 10) / 10, Math.round(q.y * 10) / 10]; });
      emit({ ts: nextTs(), commands: [{ op: "add_object", type: "freehand", x: pp[0][0], y: pp[0][1],
             props: { points: pp, color: "", width: 3, closed: false } }] });
    }
    function esc(ev) { if (ev.key === "Escape") { aborted = true; cleanup(); } }   // cancel, no emit
    document.addEventListener("keydown", esc, true);
    svg.addEventListener("pointermove", move); svg.addEventListener("pointerup", up);
  }

  function render() {
    applyColors(cfg.colors || {});
    stage.innerHTML = cfg.svg || "";
    svg = stage.querySelector("svg");
    if (!svg) { setHeight(); return; }
    wireObjects();
    // empty-pitch pointerdown: draw a new object if a draw tool is armed, else clear selection
    svg.addEventListener("pointerdown", function (e) {
      if (!isEmptyPitch(e)) return;                       // on a piece/handle -> their own drags
      if (cfg.editable && cfg.drawTool) { beginDraw(e); return; }
      if (cfg.editable) { beginMarquee(e); return; }      // drag-to-select (click = clear)
      if (cfg.selectedId != null) select(null);
    });
    renderPalette();
    setHeight();
  }

  // Keyboard editor shortcuts. All go through the SAME intent channel / trust boundary; the
  // JS never mutates the board. Guarded so they never fire while typing in an input/textarea/
  // select/contenteditable, and only when this canvas iframe has focus (the listener lives in
  // the iframe document, so typing in a Streamlit control outside the iframe never reaches it).
  window.addEventListener("keydown", function (e) {
    if (!cfg.editable || isTypingTarget(e.target)) return;
    var ctrl = e.ctrlKey || e.metaKey;
    var key = e.key, sel = selArray();
    if (ctrl && (key === "a" || key === "A")) {           // select all VISIBLE objects on the frame
      e.preventDefault();
      emitSel(objects.map(function (o) { return o.id; }).filter(function (id) { return !!groupOf(id); }));
    } else if (ctrl && (key === "z" || key === "Z") && !e.shiftKey) {
      e.preventDefault();
      emit({ ts: nextTs(), select: "__keep__", commands: [], undo: true });
    } else if (ctrl && ((key === "y" || key === "Y") || ((key === "z" || key === "Z") && e.shiftKey))) {
      e.preventDefault();
      emit({ ts: nextTs(), select: "__keep__", commands: [], redo: true });
    } else if (ctrl && (key === "d" || key === "D")) {
      if (sel.length) { e.preventDefault(); emit({ ts: nextTs(), select: "__keep__", commands: [{ op: "duplicate_objects", ids: sel }] }); }
    } else if (key === "Delete" || key === "Backspace") {
      if (sel.length) {
        e.preventDefault();
        cfg.selectedId = null; cfg.selectedIds = [];
        emit({ ts: nextTs(), select: null, commands: [{ op: "delete_objects", ids: sel }] });
      }
    } else if (key === "Escape") {
      e.preventDefault();
      if (cfg.drawTool) {                                 // exit persistent draw mode (UI-only intent)
        cfg.drawTool = null;
        emit({ ts: nextTs(), select: "__keep__", commands: [], draw_reset: true });
      } else if (sel.length) {
        emitSel([]);                                       // else clear the selection
      }
    } else if (key.indexOf("Arrow") === 0 && sel.length) {
      e.preventDefault();
      var step = e.shiftKey ? 5 : 1, dx = 0, dy = 0;       // nudge in pitch units (Shift = larger)
      if (key === "ArrowLeft") dx = -step; else if (key === "ArrowRight") dx = step;
      else if (key === "ArrowUp") dy = -step; else if (key === "ArrowDown") dy = step;
      emit({ ts: nextTs(), select: sel.length === 1 ? sel[0] : sel.slice(),
             commands: [{ op: "move_objects", ids: sel, dx: dx, dy: dy }] });
    }
  });

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    cfg.svg = args.svg || "";
    cfg.editable = args.editable !== false;
    cfg.snap = Number(args.snap || 0);
    cfg.selectedId = args.selected_id != null ? args.selected_id : null;
    cfg.selectedIds = Array.isArray(args.selected_ids) ? args.selected_ids
                      : (cfg.selectedId != null ? [cfg.selectedId] : []);
    cfg.colors = args.colors || {};
    cfg.palette = args.palette || [];
    cfg.drawTool = args.draw_tool || null;   // {type, props} arms click-drag draw mode, else null
    objects = args.objects || [];
    render();
  });

  window.addEventListener("resize", setHeight);
  if (window.ResizeObserver) { new ResizeObserver(setHeight).observe(document.body); }
  ready();
  window.addEventListener("load", setHeight);
})();
</script>
</body>
</html>
