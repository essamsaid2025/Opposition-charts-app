<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Report Studio v2 (Phase A) — architecture proof.
  React shell + Konva rendering engine, loaded from LOCAL vendored MIT/Apache
  bundles (no CDN at runtime, no Node build step). react-konva is intentionally
  NOT used here: it ships ESM-only and needs a bundler, which this repo's
  component pipeline does not have; React drives the shell and Konva is driven
  directly (a legitimate React+Konva setup). See REPORT_STUDIO_LICENSES.md.
-->
<style>
  :root { color-scheme: light dark; --accent:#2f7bd6; --edge:#d8dee9; --paper:#ffffff;
          --ink:#1b2430; --muted:#8a93a2; }
  html, body { margin:0; padding:0; background:transparent;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  #root { display:flex; flex-direction:column; gap:8px; align-items:stretch; }
  .rs-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .rs-title { font-weight:600; border:1px solid var(--edge); border-radius:6px; padding:4px 8px;
    min-width:180px; background:var(--paper); }
  .rs-btn { border:1px solid var(--edge); background:var(--paper); border-radius:6px;
    padding:5px 10px; cursor:pointer; font-size:13px; }
  .rs-btn:hover { border-color:var(--accent); }
  .rs-spacer { flex:1 1 auto; }
  .rs-status { font-size:12px; color:var(--muted); }
  .rs-stage-wrap { position:relative; overflow:auto; max-width:100%;
    box-shadow:0 6px 24px rgba(16,22,30,.18), 0 1px 3px rgba(16,22,30,.10);
    outline:1px solid var(--edge); border-radius:3px; background:var(--paper); }
  .rs-hint { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<!-- Vendored, committed, permissive-licensed. Order matters (React before app). -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/htm.umd.js"></script>
<script src="./vendor/konva.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
